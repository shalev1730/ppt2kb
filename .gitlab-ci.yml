# GitLab CI (self-hosted GitLab inside the closed network).
# Variables you may need to set on the project (Settings -> CI/CD -> Variables):
#   PIP_INDEX_URL   - internal PyPI mirror (e.g. https://nexus.internal/repository/pypi/simple)
#   APT_MIRROR      - internal Debian mirror for the image build
#   CI_REGISTRY_*   - provided by GitLab when the container registry is enabled
stages: [test, image]

test:
  stage: test
  image: python:3.12-slim-bookworm
  timeout: 40m
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libreoffice-impress libreoffice-draw fonts-dejavu-core fonts-liberation2 fonts-noto-core culmus fontconfig
    - fc-cache -f
    - pip install -r requirements.txt -e ".[dev]"
  script:
    - python -m pytest tests -v --durations=8 --junitxml=report.xml
    - cyclonedx-py requirements requirements.txt -o sbom-ci.cdx.json
  artifacts:
    when: always
    reports: { junit: report.xml }
    paths: [sbom-ci.cdx.json]

image:
  stage: image
  image: quay.io/buildah/stable
  needs: [test]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - export TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - buildah bud --isolation chroot ${APT_MIRROR:+--build-arg APT_MIRROR=$APT_MIRROR} ${PIP_INDEX_URL:+--build-arg PIP_INDEX_URL=$PIP_INDEX_URL}
        -f deploy/docker/Dockerfile -t "$CI_REGISTRY_IMAGE:$TAG" .
    - buildah push "$CI_REGISTRY_IMAGE:$TAG" "docker-archive:ppt2kb-web-offline.tar:ppt2kb:$TAG"
    - if [ -n "$CI_REGISTRY" ]; then buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY" && buildah push "$CI_REGISTRY_IMAGE:$TAG"; fi
  artifacts:
    paths: [ppt2kb-web-offline.tar]
    expire_in: 2 weeks
